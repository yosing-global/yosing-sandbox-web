name: pr-cleanup

# PR を閉じたとき（マージ・マージせずに閉じる、のどちらも）に、PR 環境（pr<番号>）を消す
#   ECS のサービス・Cloud Map のサービス・稼働時間のスケジュール
#   タスク定義の履歴と ECR のイメージは残す（害がなく、イメージは ECR のライフサイクルで消える）
#   PR 環境で登録したユーザー（dev のテーブル）は消さない
on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

# pr.yml と同じグループ。PR 環境へのデプロイが動いていれば止めてから消す
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-1

jobs:
  cleanup:
    # フォークからの PR は AWS に入れない（PR 環境も作っていない）
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      # PR へのコメント（PR 環境の URL）を「削除済み」に書き換える
      pull-requests: write
    env:
      APP_ENV: pr${{ github.event.pull_request.number }}
    steps:
      # ロールの ARN・レジストリは Secrets に置く（Secrets の値は、どのステップのログでも最初から伏せられる。
      #   Variables だと、伏せる前のステップの env の表示に元の値が出る）。ここでは、アカウント ID だけが出る場面
      #   （ecspresso の差分・AWS CLI の出力等）のために、アカウント ID（ロールの ARN の NonProd と、レジストリの先頭の Shared-Infra）を伏せる
      - name: 値の伏せ字
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          echo "::add-mask::$(echo "${AWS_ROLE_ARN}" | cut -d: -f5)"
          echo "::add-mask::${ECR_REGISTRY%%.*}"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: 設定値の取得（SSM パラメータ）
        run: |
          get() { aws ssm get-parameter --name "$1" --query Parameter.Value --output text; }
          echo "ECS_CLUSTER=$(get /products/sandbox/ecs/cluster-name)" >> "$GITHUB_ENV"
          echo "NAMESPACE_ID=$(get /products/sandbox/cloud-map/namespace-id)" >> "$GITHUB_ENV"

      # 登録を外すと、スケジュール（開始・停止）も一緒に消える
      - name: 稼働時間のスケジュールの削除
        run: |
          resource="service/${ECS_CLUSTER}/${APP_ENV}-web"
          count=$(aws application-autoscaling describe-scalable-targets --service-namespace ecs \
            --resource-ids "${resource}" --query 'length(ScalableTargets)' --output text)
          if [ "${count}" = "0" ]; then
            echo "登録が無い"
            exit 0
          fi
          aws application-autoscaling deregister-scalable-target --service-namespace ecs \
            --scalable-dimension ecs:service:DesiredCount --resource-id "${resource}"

      # タスクを止めてサービスを消し、消え終わるまで待つ（タスクが止まると Cloud Map の登録も外れる）
      - name: ECS のサービスの削除
        run: |
          service="${APP_ENV}-web"
          status=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${service}" \
            --query 'services[0].status' --output text)
          case "${status}" in
            ACTIVE)
              aws ecs delete-service --cluster "${ECS_CLUSTER}" --service "${service}" --force > /dev/null
              ;;
            DRAINING)
              ;;
            *)
              echo "サービスが無い（${status}）"
              exit 0
              ;;
          esac
          aws ecs wait services-inactive --cluster "${ECS_CLUSTER}" --services "${service}"

      # 登録（タスクの IP）が残っていると消せないため、外れるのを待ってから消す
      - name: Cloud Map のサービスの削除
        run: |
          name="${APP_ENV}-web"
          id=$(aws servicediscovery list-services \
            --filters "Name=NAMESPACE_ID,Values=${NAMESPACE_ID},Condition=EQ" \
            --query "Services[?Name=='${name}'].Id | [0]" --output text)
          if [ -z "${id}" ] || [ "${id}" = "None" ]; then
            echo "サービスが無い"
            exit 0
          fi
          for i in $(seq 1 30); do
            count=$(aws servicediscovery list-instances --service-id "${id}" --query 'length(Instances)' --output text)
            if [ "${count}" = "0" ]; then
              aws servicediscovery delete-service --id "${id}"
              exit 0
            fi
            sleep 10
          done
          echo "登録が外れないため、消せなかった"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pr.yml が出した PR 環境のコメントを「削除済み」に書き換える（コメントが無ければ何もしない）
      - name: PR へのコメント
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          deleted_at=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')
          bash .github/scripts/pr-env-comment.sh "${PR_NUMBER}" update <<EOF
          ### PR 環境：${APP_ENV}（削除済み）

          PR を閉じたため、PR 環境を削除しました（${deleted_at} JST）。
          EOF
